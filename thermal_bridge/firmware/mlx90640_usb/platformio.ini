; mlx90640_usb -- 2x MLX90640 -> USB CDC "MLXF" v1 stream. See README.md.
;   pio run -e pico -t upload      (or copy .pio/build/pico/firmware.uf2 to RPI-RP2)
;   pio run -e esp32s3 -t upload
[platformio]
default_envs = pico

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MLX90640 @ ^1.1.1
    adafruit/Adafruit BusIO @ ^1.16.1

; Raspberry Pi Pico (RP2040), Earle Philhower's arduino-pico core.
; Core0 = sensor 0 + commands, core1 = sensor 1. 200 MHz helps the soft-float To math.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
board_build.f_cpu = 200000000L
build_flags = -O2 -DMLX_BOARD_PICO

; ESP32-S3-DevKitC-1, native USB port (USB-Serial/JTAG CDC, enumerates as /dev/ttyACM*).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -O2
    -DMLX_BOARD_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
